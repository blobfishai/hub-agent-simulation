[task]
name = "blobfishai/hubbench-itsmdesk-003"
version = "1.2.0"
description = "The identity gateway's signing certificate expires at the end of the month and Mathis wants the chain rotation on Thursday night. The gateway is tier-1, the rotation reserves a whole session, and it needs a certified secondary for the block, so I need to know whether Thursday genuinely fits on a lane that can carry a tier-1 change without displacing the embargo or the audit freeze, and if not, the earliest session that does. Confirm the downtime fits the error budget too. Book the pending change where it truly fits and leave Mathis a note with the date, what constrained it, and what the alternatives would have cost or required."
authors = [{ name = "Blobfish AI" }]
