schema_version = "1.4"

[task]
name = "blobfishai/hubbench-hostops-004"
version = "1.4.0"
description = "Compliance is pushing to get a week of audit logs restored and indexed quickly because the regulator session is Monday. The volume is metered per day and part of what we hold was flagged by the scrub after the power event. I need to know how many day segments the week really needs at the current metering, how much of our catalog can actually be used, whether Ironhold's standard or expedited retrieval gets us there in time for the date compliance gave, and what pulling the DR replica would involve. Place the restore job that is actually approved, then draft the update for Matteo and the on-call channel."
authors = [{ name = "Blobfish AI" }]
keywords = ["hubbench", "hostops", "terminal-operations", "plan", "mcp", "stateful", "multi-system", "deterministic", "clean-room-synthetic"]

