description = "The homepage hero ships Monday on the new accent ramp and the design file's impact panel claims eleven consumers are affected, which nobody trusts. Tell me exactly how many consumers the breaking token version reaches per the change request, how many the live registry actually shows, how many of those genuinely have to be held on the current version once the deprecated, migrated, and homepage rows drop out, and whether waiting for the agency migration is the better call. Record the pin the evidence supports and draft the message to Priya so the design-system side is not surprised."
