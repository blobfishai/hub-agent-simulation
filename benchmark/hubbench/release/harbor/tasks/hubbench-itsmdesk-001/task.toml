[task]
name = "blobfishai/hubbench-itsmdesk-001"
version = "1.3.0"
description = "Quillstone's high-severity runtime advisory landed on Friday and security wants the payments API patched tonight. Before anyone promises that, I need the honest picture: how many minutes of downtime the fix really costs at our current restart timing rather than the vendor's estimate, how much error budget is genuinely spendable once the charged incidents and the reserve are netted, whether the settlement freeze or the weekday embargo pushes the work to the weekend, and what buying the early-access build or asking Tunde for an exception would actually change. Schedule the change into the window that holds up and leave Lena a draft she can send security. Anything that needs Tunde or Inês should be flagged, not assumed."
authors = [{ name = "Blobfish AI" }]
