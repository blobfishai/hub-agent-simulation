[task]
name = "blobfishai/hubbench-scilab-002"
version = "1.4.0"
description = "Next week's lipid-panel arm runs are on the analyser calendar and Réka wants the control order placed today rather than Thursday. Work out how many control vials the booked runs actually need, which part of the fridge stock can legitimately be used for those dates, and how many we should be ordering from Calder under the approval she already signed. Place the order if it fits, and draft the note for Kenta so his team knows what arrives and when. If something would need Camille or a satellite transfer, say so instead of doing it."
