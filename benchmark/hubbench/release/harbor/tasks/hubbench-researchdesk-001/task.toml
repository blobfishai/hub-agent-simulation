[task]
name = "blobfishai/hubbench-researchdesk-001"
version = "1.1.0"
description = "The operating review draft quotes two different Q2 customer-logo churn figures, and the board secretary needs one defensible number before Thursday. Resolve the active article and metric definition, separate genuine cancellations from migrations and administrative closures, and reconcile the ledger, cohort export, and methodology register to the exact supported basis-point figure. Compare publishing that figure now with waiting for finance reconciliation or reusing the retired definition. Publish only the claim covered by Mina's approval and leave the board secretary a draft explanation of why the older headline differs."
authors = [{ name = "Blobfish AI" }]
