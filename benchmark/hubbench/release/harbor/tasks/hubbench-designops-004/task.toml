[task]
name = "blobfishai/hubbench-designops-004"
version = "1.3.0"
description = "Certification is pushing to get the rev B sensor bracket cut in quickly because the regulator's conformity review is a week on Friday. Several certificates list the bracket at the old revision and part of the where-used is superseded or phantom. I need to know how many certified configurations the change really affects, how many certificates survive it, whether Northbank's standard or expedited slot gets us there before the date certification gave, and what an interim deviation would involve. Place the re-certification order that is actually approved, then draft the update for Kenji and the regulatory liaison."
authors = [{ name = "Blobfish AI" }]
keywords = ["hubbench", "designops", "manufacturing-engineering-design", "plan", "mcp", "stateful", "multi-system", "deterministic", "clean-room-synthetic"]

