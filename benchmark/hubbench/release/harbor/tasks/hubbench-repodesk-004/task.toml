[task]
name = "blobfishai/hubbench-repodesk-004"
version = "1.2.0"
description = "Compliance is pushing to get the audit export re-verified across the regulated tenant configurations and deployed quickly because Tamsin's regulator session is Monday. The scope is counted per tenant configuration and part of what we hold was flagged by the bundle audit after the runner-image incident. I need to know how many gate runs the session really needs at the current impact analysis, how much of our evidence register can actually be used, whether Brightwater's standard or expedited bench gets us there in time for the date compliance gave, and what waiving the failed bundle would involve. Place the certification order that is actually approved, then draft the update for Chidi and the on-call channel."
