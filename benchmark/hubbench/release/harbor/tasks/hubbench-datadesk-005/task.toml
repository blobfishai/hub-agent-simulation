[task]
name = "blobfishai/hubbench-datadesk-005"
version = "1.0.0"
description = "Cormorant flipped their clickstream to a new event schema without notice and our parser has been silently dropping the consent fields ever since, so attribution is wrong going into Thursday's growth review. Work out which event days in the trailing window still stand, which were parsed from the new schema, and how many days genuinely need reprocessing. Then see whether their standard or expedited re-export actually lands in time once you account for the warehouse windows we can use. Schedule the reload the approval covers, and draft the note for the growth lead, flagging any full-history option for Ingrid."
authors = [{ name = "Blobfish AI" }]
keywords = ["hubbench", "datadesk", "data-engineering-analytics", "plan", "mcp", "stateful", "multi-system", "deterministic", "clean-room-synthetic"]

