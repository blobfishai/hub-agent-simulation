[task]
name = "blobfishai/hubbench-scilab-007"
version = "1.3.0"
description = "Building C goes dark for decontamination from the twenty-third and the NfL validation panel is currently booked after that. The study director says it can come forward. Its panel size depends on the study sample tier, the control lots on hand are a mix of good, short-dated, and one that failed incoming QC, and Calder has quoted two delivery dates. I need to know whether we can run the panel before the cutoff, on what day, and at what cost, and whether the short-dated lot could carry it instead. Rebook the run accordingly and draft the note for Folake."
authors = [{ name = "Blobfish AI" }]
