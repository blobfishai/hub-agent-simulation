[task]
name = "blobfishai/hubbench-secops-002"
version = "1.2.0"
description = "Next week's billing custody reviews are on the responder calendar and Imre wants the Brindle rollover order placed today rather than Thursday. Work out how many credential objects the scheduled reviews actually require, which part of the registry holdings can legitimately count as tenant-revocable for those dates, and how many we should be ordering from Brindle under the approval he already signed. Place the order if it fits, and draft the note for Rohan so his team knows what is invalidated and when. If something would need Nienke or a rollover of every billing principal, say so instead of doing it."
authors = [{ name = "Blobfish AI" }]
