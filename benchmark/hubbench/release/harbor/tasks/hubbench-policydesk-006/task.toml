schema_version = "1.4"

[task]
name = "blobfishai/hubbench-policydesk-006"
version = "1.3.0"
description = "One approver went on leave from today until the twenty-fifth, which strands the two month-end close-review sessions booked on her for Monday. The close control date is Thursday, so they cannot wait for her return. Work out how much review time the stranded sessions need, what is honestly free on the two remaining tier-1-capable approvers without touching the protected freeze windows, and how far into the week the last review lands. Move the first stranded session to the window you settle on, and leave a note that lays out the second and any option that would need the risk committee. Grace posts to the ledger and wants close review too; treat that on its merits."
authors = [{ name = "Blobfish AI" }]
keywords = ["hubbench", "policydesk", "policy-compliance-instruction-following", "schedule", "mcp", "stateful", "multi-system", "deterministic", "clean-room-synthetic"]

