[task]
name = "blobfishai/hubbench-workplace-008"
version = "1.4.0"
description = "Halcyon are claiming resolution-time credits for the early-April scheduling outage, five tickets in all, and their renewal invoice goes out on the twenty-fourth and cannot be re-issued. Check each ticket's resolution clock against the Enterprise policy, set aside the duplicate and the one raised inside their own maintenance window, net off what the ledger already carries for this escalation, and tell me how much we still owe. Raise the credit on the route that lands before the renewal invoice within Folake's approval, and draft the note for Bryn. The gross figure and any exception for the maintenance-window ticket belong to Mats and Desmond, not to us."
