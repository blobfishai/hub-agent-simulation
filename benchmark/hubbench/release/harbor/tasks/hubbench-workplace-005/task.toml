[task]
name = "blobfishai/hubbench-workplace-005"
version = "1.4.0"
description = "Corvane's commercial team wants liquidated damages for the meter-data connector and they are counting five weeks, through the day they say it finally stabilised. The certificate we signed tells a different story. Work out what clause 11.2 actually yields from the committed date to the accepted date, what the cap allows, what is already pending on their ledger against this claim, and how much we still owe. Raise the credit the evidence supports on the route that meets the settlement deadline, and draft the reply for Ffion. Their five-week figure and any support-days substitute are for Mats or Desmond to decide, not for us to raise."
