[task]
name = "blobfishai/hubbench-researchdesk-004"
version = "1.1.0"
description = "The product launch brief says self-service deflected nearly eight out of ten support requests, but operations says the headline includes bot handoffs and duplicate contacts that the current definition excludes. Locate the authoritative article and current measurement period, reconcile the event ledger, help-center cohort, and exclusion register, and compute the exact supported basis-point figure. Compare publishing the corrected result, waiting for another event replay, and keeping the retired headline. Persist only the approved current-definition claim and leave product marketing a draft that makes the definition change and residual gap explicit."
authors = [{ name = "Blobfish AI" }]
keywords = ["hubbench", "researchdesk", "reasoning-knowledge-qa", "quantity", "mcp", "stateful", "multi-system", "deterministic", "clean-room-synthetic"]

