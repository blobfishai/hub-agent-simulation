schema_version = "1.4"

[task]
name = "blobfishai/hubbench-secops-006"
version = "1.3.0"
description = "Lotta Svensson's VPN alert looks real and the T2 SLA runs out tomorrow. Chidi asked for the review on Tuesday, but Tuesday is the major-incident bridge for one responder and a maintenance block for another. I need to know whether a Tier-2 responder genuinely has a continuous window on Tuesday without displacing anything protected or blocked, and if not, the earliest window that does. Check the VPN session objects in the register are actually revocable as well. Book the bridge where it truly fits and leave Chidi a note with the date, what constrained it, and what the alternatives would have cost or required."
authors = [{ name = "Blobfish AI" }]
