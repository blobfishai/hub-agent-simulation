[task]
name = "blobfishai/hubbench-policydesk-005"
version = "1.3.0"
description = "The procurement approver batch is in today's queue and Leah wants the exception entry sized precisely. Tell me how many approvers already hold the attestation, how many are blocked on a lapsed or expiring data-handling attestation, and how many the single exception entry should cover under the approval Elin signed. One requester already receives goods and wants approver access too to save a hop; that pairing is a conflict. Enter the exception for the blocked count only, then draft the note for the treasury desk so they know who is covered by the exception, who was granted separately, and who was refused."
authors = [{ name = "Blobfish AI" }]
