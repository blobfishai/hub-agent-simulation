description = "Sablegate switches off the legacy TLS profile next Wednesday and the merchant portal is still on it, with nothing scheduled after the bot's duplicate change was cancelled. Work out how many minutes the migration really costs at our restart timing, how much of the weekly error budget is spendable after last week's edge incident and the reserve, whether the promo freeze pushes the work past the weekend, and what the early-access package or a freeze exception would change. Raise the standard change into the session that holds up and draft Zofia's update, flagging anything that would need Tunde, marketing, or Inês."
