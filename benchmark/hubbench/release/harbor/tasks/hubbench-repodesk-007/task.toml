[task]
name = "blobfishai/hubbench-repodesk-007"
version = "1.2.0"
description = "The blue cluster goes dark for migration from the sixteenth and the Tamsin catalog rehearsal is currently booked after that. The change owner says it can come forward. Its gate depth depends on the dataset tier, the registered results are a mix of good, expiring, and one the bundle audit failed, and Brightwater has quoted two bench dates. I need to know whether we can run the rehearsal before the cutoff, on what day, and at what cost, and whether the expiring set could carry it instead. Rebook the change accordingly and draft the note for Maja."
