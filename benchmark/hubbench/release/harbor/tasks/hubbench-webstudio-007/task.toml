[task]
name = "blobfishai/hubbench-webstudio-007"
version = "1.4.0"
description = "The site goes into the annual-results content freeze from the twenty-third and the partner portal tier-2 rebrand is currently booked after it. The change owner says it can come forward. Its lock-up image needs licences for three territories, the grants in the library are a mix of good, one about to lapse, and a renewal bundle nobody has countersigned, and Stillframe has quoted two issuance dates. I need to know whether we can ship before the cutoff, on what day, and at what cost, and whether the pending bundle could carry it instead. Rebook the release accordingly and draft the note for Beatriz."
