[task]
name = "blobfishai/hubbench-datadesk-006"
version = "1.4.0"
description = "Platform ops pulled cluster XL this morning for a storage firmware patch that runs through next Thursday, stranding the four certified finance loads that live in its night window. None of them may run more than five business days past its cycle date or the mart is decertified. Figure out how much window time the loads need, what is honestly open on the standard cluster without touching replication, and how far into next week the last one lands. Re-window the first stranded load where it fits and leave warehouse ops a note covering the rest and anything needing Femi."
authors = [{ name = "Blobfish AI" }]
keywords = ["hubbench", "datadesk", "data-engineering-analytics", "schedule", "mcp", "stateful", "multi-system", "deterministic", "clean-room-synthetic"]

