[task]
name = "blobfishai/hubbench-scilab-005"
version = "1.0.0"
description = "Two toxicology cohort runs sit on the analyser calendar this week and the main fridge is nearly empty. The annex says they have control vials, but some are spoken for and one lot looked expired on the last dating sweep. Tell me exactly how many vials the two runs need, how many are already usable here, how many can legitimately come over from the annex, and whether ordering direct from Ostrander is the better call. Schedule the transfer the evidence supports and draft the message to the annex operator so the courier pickup is not a surprise."
authors = [{ name = "Blobfish AI" }]
keywords = ["hubbench", "scilab", "scientific-research", "quantity", "mcp", "stateful", "multi-system", "deterministic", "clean-room-synthetic"]

