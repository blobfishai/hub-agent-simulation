[task]
name = "blobfishai/hubbench-repodesk-001"
version = "1.2.0"
description = "Last night's gate run on the checkout totals fix died halfway through the dedicated-pipeline stage and Ashgrove's cutover is Thursday morning. Before the customer call I need the honest picture: how many gate runs the affected modules actually need on both pipelines at the current impact analysis, how many of the registered results genuinely count once the quarantined flake output and the expiring set are set aside, whether Corvane's certification changes the date, and what a hotfix train with an expedited review would really involve. Book the deploy window that works and leave Ines a draft she can take into the call. Anything that needs Hanna or Tobias should be flagged, not assumed."
