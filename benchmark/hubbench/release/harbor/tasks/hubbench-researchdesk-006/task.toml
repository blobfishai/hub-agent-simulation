[task]
name = "blobfishai/hubbench-researchdesk-006"
version = "1.2.0"
description = "People leadership found three attrition percentages in the quarterly talent narrative, each using a different treatment of internal transfers, retirements, and acquired employees. Resolve the active knowledge revision, quarter boundary, and approved population definition; reconcile the HR event export, opening-headcount control, and exclusions register to the exact supported basis-point figure. Compare publishing the current result with waiting for payroll close or reusing the legacy calculation. Publish only the claim within the signed scope and draft People leadership an explanation that distinguishes the current metric from the retired headline."
