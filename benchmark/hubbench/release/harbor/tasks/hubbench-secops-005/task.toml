[task]
name = "blobfishai/hubbench-secops-005"
version = "1.3.0"
description = "The fleet A partner key was used from an egress that is not on the partner register, and both fleet custody reviews sit on the responder calendar this week. Rohan wants the Brindle registry revocation placed today. Work out how many credential objects the two reviews actually require, how many of the registry holdings are genuinely tenant-revocable once the owner-held DR copies and the expired key are set aside, what the IAM-side key already covers, and how many we should revoke under the approval Imre signed. Schedule the revocation that fits, draft the note for Rohan, and flag anything that would need Nienke instead of doing it."
authors = [{ name = "Blobfish AI" }]
keywords = ["hubbench", "secops", "security", "quantity", "mcp", "stateful", "multi-system", "deterministic", "clean-room-synthetic"]

