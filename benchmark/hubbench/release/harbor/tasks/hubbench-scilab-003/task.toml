[task]
name = "blobfishai/hubbench-scilab-003"
version = "1.0.0"
description = "The quarterly HbA1c reference-method validation is supposed to happen this week and Folake asked for Thursday. It is a long continuous run with evidence capture, so I need to know whether Thursday genuinely fits on an analyser with current operational qualification without displacing the proficiency panel, and if it does not, the earliest day that does. Confirm the control vials are actually released too. Book the pending run where it truly fits, and leave a note for Folake with the date, what constrained it, and what the alternatives would have cost or required."
