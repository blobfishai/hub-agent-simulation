[task]
name = "blobfishai/hubbench-datadesk-002"
version = "1.4.0"
description = "Harrier shipped us a bad landed-cost reference cut and the margin mart has been quietly wrong for days; the CFO reviews margins Friday morning. Establish which daily partitions in the trailing window are still trustworthy, which ones consumed the contaminated file, and how many genuinely need reloading rather than rebuilding everything. Then test whether the vendor's corrected files, standard or expedited, actually change when a backfill can run given the batch windows we're allowed to touch. Schedule the correction that is actually approved and draft the note for the pricing team, flagging anything that would need Femi's sign-off."
