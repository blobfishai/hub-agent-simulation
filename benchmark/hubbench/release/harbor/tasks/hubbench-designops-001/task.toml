description = "Friday's drawing check-in for the rev C mount bracket failed and this morning's passed, and the pivot arm build lot starts a week on Monday. Before the change meeting I need the honest picture: which assemblies the change genuinely touches once the obsolete parents and alternates are set aside, which certificates a Class I change like this actually invalidates, when Northbank can re-certify on their standard or expedited slot, and whether an interim exception this week is ours to grant at all. Release the change with the effectivity date that truly works and leave Rowan a draft he can take into the meeting. Anything that needs Chidi or Henrike should be flagged, not assumed."
