[task]
name = "blobfishai/hubbench-designops-006"
version = "1.2.0"
description = "Line one's PLC failed this morning's safety validation and it is fenced until the twenty-second, which strands the panel latch cut-ins booked on it this week. The customer commitment is firm that none of them can slip past a week beyond their due date. Figure out how much line time those runs need, what is honestly open on the other two lines without touching the protected blocks, and how far into next week the last of them lands. Move the first affected reservation to the window you settle on, and leave Tunde a note that lays out the rest and any option that would need Henrike."
