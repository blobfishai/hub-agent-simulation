schema_version = "1.4"

[task]
name = "blobfishai/hubbench-researchdesk-002"
version = "1.0.0"
description = "Sales strategy is challenging the renewal-risk paragraph in next week's planning memo because the current knowledge article links to a mix of live evidence, an expired forecast, and a search snippet with no source context. Establish the current definition and the minimum source coverage the memo requires, remove superseded or conflicting material, and quantify the remaining evidence gap. Compare a verified packet with waiting for the archive refresh or publishing snippets alone. Create the approved packet with the exact included and excluded sources, then draft a note explaining what the packet supports and what still needs separate authority."
authors = [{ name = "Blobfish AI" }]
keywords = ["hubbench", "researchdesk", "reasoning-knowledge-qa", "plan", "mcp", "stateful", "multi-system", "deterministic", "clean-room-synthetic"]

