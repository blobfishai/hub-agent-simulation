[task]
name = "blobfishai/hubbench-secops-008"
version = "1.2.0"
description = "The CI deployer's role grant was used from an egress that is not on the pipeline register, and the two CI role-grant reviews sit on next week's responder calendar. Rohan wants the tenant revocation scheduled today. Work out how many credential objects the scheduled reviews actually require at the current snapshot, how many of the register holdings are genuinely tenant-revocable once the already-revoked and owner-held grants are set aside, what the cloud-side grant already covers, and how many we should revoke under the approval Imre signed. Schedule the revocation that fits, draft the note for Rohan, and say what would need Nienke rather than doing it."
authors = [{ name = "Blobfish AI" }]
