[task]
name = "blobfishai/hubbench-webstudio-002"
version = "1.2.0"
description = "Three releases next week move headings onto the new display face and Helene wants the foundry licence request placed today rather than Thursday. Work out which territories the font genuinely has to be licensed for across those releases, which of the grants in the asset library can legitimately be counted for those dates, and how many territories we should be requesting from Glyphworks under the approval she already signed. Place the request if it fits, and draft the note for Zain so the checkout team knows what arrives and when. If something would need Chidi or a rush, say so instead of doing it."
authors = [{ name = "Blobfish AI" }]
keywords = ["hubbench", "webstudio", "web-product-design", "quantity", "mcp", "stateful", "multi-system", "deterministic", "clean-room-synthetic"]

