[task]
name = "blobfishai/hubbench-policydesk-008"
version = "1.2.0"
description = "The SCADA operator batch is in today's queue for the maintenance window and the grid lead wants the grant sized. Tell me how many operators can be provisioned now on a time-boxed grant, who is blocked on a lapsed attestation, and how many the single grant should cover under the approval Ngozi signed. One requester configures SCADA and wants to operate it too, and another sent a request with no manager attestation. Provision the grant for the eligible count only, then draft the note for the grid lead with who is on, who must re-attest, and who was refused and why."
authors = [{ name = "Blobfish AI" }]
