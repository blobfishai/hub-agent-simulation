[task]
name = "blobfishai/hubbench-webstudio-008"
version = "1.2.0"
description = "The email campaign lands Tuesday and the plans comparison page has to carry the new plan names by then, but not everything in the change request can go: two entries depend on breaking component and token changes nobody has pinned, the hero image licence is unsigned, and one entry is still in draft. Tell me how many entries the request covers, how many are reviewed, how many can genuinely ship once the blocked ones are set aside, and whether waiting for the full change is the better call. Schedule the subset the evidence supports under Helene's approval, then draft the note for Kwame so growth knows what lands and what waits."
