description = "Camille wants the sales kickoff planning offsite at Kestrel Lodge in the week of 22 June, but only if all eight regional leads can be in the room for the three session days. Work out how many attendee-days the sessions need, what the requested week actually offers once travel days and the leads' hard commitments are removed, and, if it falls short, the earliest open week at the lodge where nobody is missing and the territory-plan lock is still respected. Place the venue hold on the week that fits, using the quote that is actually current, and leave Camille a note explaining the week, what ruled out the others, and anything that would need Petra or the lodge's events director."
