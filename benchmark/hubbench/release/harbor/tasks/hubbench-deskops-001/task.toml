[task]
name = "blobfishai/hubbench-deskops-001"
version = "1.3.0"
description = "Harrow Court has withdrawn the week we had for the Product and Design offsite and offered later weeks instead, and Anneli needs a date she can defend before the planning lock. Work out how many of the required attendees genuinely have to travel under the current agenda, how many of their existing tickets can be moved and how many are lost, which week the venue and everyone's calendars honestly allow, and whether paying Wayfinder for rush ticketing changes anything. Move the offsite to the week that works and leave Anneli a draft she can send the team. Anything that would need Delia, Ifeoma, or Petra should be flagged, not assumed."
