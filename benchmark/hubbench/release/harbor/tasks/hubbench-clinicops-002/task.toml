[task]
name = "blobfishai/hubbench-clinicops-002"
version = "1.3.0"
description = "Next week's oncology clinic has several pembrolizumab patients on the books and Priya wants the restock order placed today rather than Friday. Work out how many vials the scheduled doses actually need, what part of our stock can legitimately be used for those dates, and how many we should be ordering from Meridian under the approval she already signed. Place the order if it fits, and draft the note for the oncology charge nurse so she knows what is arriving and when. If something would need the director or a partner site, say so instead of doing it."
