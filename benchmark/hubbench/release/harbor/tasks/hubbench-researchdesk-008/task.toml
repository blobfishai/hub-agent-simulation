schema_version = "1.4"

[task]
name = "blobfishai/hubbench-researchdesk-008"
version = "1.4.0"
description = "Customer operations wants to tell the executive team why enterprise onboarding time rose, but the knowledge search mixes current workflow evidence with a retired implementation survey and duplicate regional extracts. Establish the active time-to-value definition and the evidence positions needed for a causal statement, remove stale or non-independent sources, and quantify what remains unsupported. Compare a verified root-cause packet with waiting for the survey refresh or publishing search snippets as if they were evidence. Create the authorized packet from the exact current sources and draft operations a note that separates supported drivers from unresolved hypotheses."
authors = [{ name = "Blobfish AI" }]
keywords = ["hubbench", "researchdesk", "reasoning-knowledge-qa", "plan", "mcp", "stateful", "multi-system", "deterministic", "clean-room-synthetic"]

