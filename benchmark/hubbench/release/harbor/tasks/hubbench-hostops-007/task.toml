[task]
name = "blobfishai/hubbench-hostops-007"
version = "1.2.0"
description = "The primary data centre goes dark for power remediation from the twenty-fifth and the catalog migration rehearsal is currently booked after that. The change owner says it can come forward. Its baseline depends on the dataset tier, the nearline segments are a mix of good, purge-queued, and one the scrub flagged, and Ironhold has quoted two retrieval dates. I need to know whether we can stage the rehearsal before the cutoff, on what day, and at what cost, and whether the purge-queued set could carry it instead. Rebook the reservation accordingly and draft the note for June."
