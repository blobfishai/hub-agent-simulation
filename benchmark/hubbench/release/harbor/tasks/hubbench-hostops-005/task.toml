description = "Two telemetry replay validations run on the farm this week and the nearline store is nearly empty. Drayton says they have segments, but some are spoken for and one set looked lapsed on the last sweep. Tell me exactly how many segments the two replays need, how many are already usable here, how many can legitimately come over from the DR store, and whether retrieving direct from Coldspur is the better call. Schedule the copy the evidence supports and draft the message to the Drayton operator so the replication pickup is not a surprise."
