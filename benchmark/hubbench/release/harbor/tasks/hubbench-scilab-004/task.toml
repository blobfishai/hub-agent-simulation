[task]
name = "blobfishai/hubbench-scilab-004"
version = "1.3.0"
description = "Stability is pushing to get the seven CX-14 timepoints re-read and reported quickly because the sponsor audit is Monday. The plates are sized per timepoint from the current sample count and part of what we hold is the lot that failed incoming QC after the freezer alarm. I need to know how many control vials the series really needs at the current count, how much of our stock can actually be used, whether Calder's standard or expedited delivery gets us there in time for the date Siobhan gave, and what pulling the satellite reserve would involve. Place the order that is actually approved, then draft the update for Siobhan and the release channel."
authors = [{ name = "Blobfish AI" }]
