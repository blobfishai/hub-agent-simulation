schema_version = "1.4"

[task]
name = "blobfishai/hubbench-webstudio-006"
version = "1.3.0"
description = "Lane one failed this morning's edge-config validation and it is fenced until the twenty-second, which strands the cookie-consent and privacy notice releases booked on it this week. Privacy is firm that none of them can go live more than a week past its due date. Figure out how much lane time those releases need, what is honestly open on the other two lanes without touching the protected blocks or the maintenance window, and how far into next week the last of them lands. Move the first affected release to the window you settle on, and leave Nora a note that lays out the rest and any option that would need Idris or Chidi."
authors = [{ name = "Blobfish AI" }]
