[task]
name = "blobfishai/hubbench-designops-007"
version = "1.3.0"
description = "The Ashgrove plant goes dark for power remediation from the twenty-seventh and the manifold cut-in is currently booked after that. The change owner says it can come forward. Its certified coverage depends on which certificates actually list the manifold, one of the old certificates has expired, and Northbank has quoted two report dates. I need to know whether we can cut in before the shutdown, on what day, and at what cost, and whether the expired certificate could carry it instead. Rebook the reservation accordingly and draft the note for Tunde."
