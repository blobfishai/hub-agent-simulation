schema_version = "1.4"

[task]
name = "blobfishai/hubbench-secops-007"
version = "1.4.0"
description = "Diogo Ferreira's session enrolled three engineering laptops on Sunday evening and Grid Control's change window is Wednesday. Before Maja goes to the change board I need the honest picture: how many certificate objects the three laptops actually require at the current per-device snapshot, how many of what the register shows are genuinely tenant-revocable once the disabled and owner-held grants are set aside, whether Halyard's invalidation job or paying to expedite it changes the date, and what revoking the owner-held substation certificate would really cost. Place the invalidation order that is actually approved and leave Maja a draft for the board. Anything that needs Nienke or Beatriz should be flagged, not assumed."
authors = [{ name = "Blobfish AI" }]
keywords = ["hubbench", "secops", "security", "plan", "mcp", "stateful", "multi-system", "deterministic", "clean-room-synthetic"]

