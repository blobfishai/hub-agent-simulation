[task]
name = "blobfishai/hubbench-workplace-001"
version = "1.4.0"
description = "Oakhaven's finance team has been chasing since the consolidated invoice batch started posting duplicate lines, and their billing-run cutover is registered for the fourth of May. Before I answer Leon I need the honest picture: how many points the fix genuinely needs under the current standard, how much of this sprint's capacity is really usable once skills, on-call, and leave are taken into account, whether Wrenfield's call-off changes the date, and what pulling the work in by dropping committed stories would actually require. Place the uncovered work where the evidence supports it and leave Leon a draft he can send to the customer. Anything that needs Bronwyn or Kirsten should be flagged, not assumed."
