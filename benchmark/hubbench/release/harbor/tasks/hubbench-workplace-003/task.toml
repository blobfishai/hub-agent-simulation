[task]
name = "blobfishai/hubbench-workplace-003"
version = "1.2.0"
description = "Northwick's transport office asked for their dispatch go-live rehearsal on Thursday and Gideon has half-promised it. It is a long continuous session with verification at the end, so I need to know whether Thursday genuinely fits a dispatch-qualified engineer without touching leave or the training already booked, and if not, the earliest day that does. Confirm the rehearsal still lands before the date registered against the go-live. Book the pending hold where it truly fits, and leave Gideon a note with the date, what constrained it, and what the alternatives would have cost or required."
authors = [{ name = "Blobfish AI" }]
