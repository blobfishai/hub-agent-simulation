[task]
name = "blobfishai/hubbench-hostops-006"
version = "1.4.0"
description = "Runner one's hypervisor failed this morning's attestation and it is fenced until the twenty-fourth, which strands the kernel patch verifications booked on it this week. Security is firm that none of them can slip past a week beyond their due date. Figure out how much runner time those runs need, what is honestly open on the other two runners without touching the protected blocks, and how far into next week the last of them lands. Move the first affected reservation to the window you settle on, and leave Amara a note that lays out the rest and any option that would need Marta."
