[task]
name = "blobfishai/hubbench-clinicops-006"
version = "1.0.0"
description = "The pump on chair one failed inspection and biomed has it out until the twentieth, which strands the natalizumab patients booked on it this week. Neurology is firm that none of them can slip past a week beyond their due date. Figure out how much chair time those infusions need, what is honestly open on the other two chairs without touching the oncology blocks, and how far into next week the last of them lands. Move the first affected appointment to the session you settle on, and leave the scheduling lead a note that lays out the rest and any option that would need Dr. Hale."
authors = [{ name = "Blobfish AI" }]
