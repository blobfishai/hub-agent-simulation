[task]
name = "blobfishai/hubbench-webstudio-003"
version = "1.4.0"
description = "The product tour redesign is supposed to go out this week and Sara asked for Thursday. It is a long continuous run with a rollback rehearsal, so I need to know whether Thursday genuinely fits on a lane with instant-rollback snapshots without displacing the campaign blackout, and if it does not, the earliest day that does. Confirm the checklist is actually green too. Schedule the pending release where it truly fits, and leave a note for Sara with the date, what constrained it, and what the alternatives would have cost or required."
