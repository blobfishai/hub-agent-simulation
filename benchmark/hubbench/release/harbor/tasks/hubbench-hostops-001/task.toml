schema_version = "1.4"

[task]
name = "blobfishai/hubbench-hostops-001"
version = "1.3.0"
description = "Last night's Atlas publish died halfway through and the 26.1 train is supposed to leave Thursday morning. Before the release meeting I need the honest picture: how many archive segments the release and its rollback baseline actually need at the current bundle size, how many of what the catalog shows are genuinely restorable once the scrub failures and the purge queue are set aside, whether Coldspur's retrieval changes the date, and what a from-source rebuild would really involve. Book the verification window that works and leave Freya a draft she can take into the meeting. Anything that needs Annika or Bisi should be flagged, not assumed."
authors = [{ name = "Blobfish AI" }]
keywords = ["hubbench", "hostops", "terminal-operations", "plan", "mcp", "stateful", "multi-system", "deterministic", "clean-room-synthetic"]

