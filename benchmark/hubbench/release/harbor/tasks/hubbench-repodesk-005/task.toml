[task]
name = "blobfishai/hubbench-repodesk-005"
version = "1.3.0"
description = "Two ingest hotfix deploys run on the lanes this week and the hotfix branch is behind the release branch. The release branch has commits in the fix range, but some are spoken for and one was reverted after it landed. Tell me exactly how many commits the two deploys need on the hotfix branch, how many are already there, how many can legitimately ride the merge queue from the release branch, and whether Corvane's certified re-verification is the better call. Schedule the backport the evidence supports and draft the message to Siobhan so the merge-queue pickup is not a surprise."
authors = [{ name = "Blobfish AI" }]
keywords = ["hubbench", "repodesk", "software-engineering", "quantity", "mcp", "stateful", "multi-system", "deterministic", "clean-room-synthetic"]

