description = "Neurology is pushing to get Kwame Boateng's IVIG in quickly because his weakness is progressing. Dr. Lindqvist's order is weight-based and pharmacy tells me part of our immune globulin is sitting in quarantine after the fridge alarm. I need to know how much the order really needs, how much of what we hold can actually be used, whether Meridian's standard or expedited delivery gets us there in time for the date neurology gave, and what borrowing from the partner hospital would involve. Place the order that is actually approved, then draft the update for neurology and scheduling."
