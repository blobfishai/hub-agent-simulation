[task]
name = "blobfishai/hubbench-hostops-002"
version = "1.0.0"
description = "Next week's payments release trains are on the farm calendar and Imogen wants the rollback-set retrieval placed today rather than Thursday. Work out how many archive segments the scheduled verifications actually need, which part of the nearline holdings can legitimately be staged for those dates, and how many we should be pulling from Ironhold under the approval she already signed. Place the restore job if it fits, and draft the note for Deepak so his team knows what arrives and when. If something would need Bisi or a DR copy, say so instead of doing it."
