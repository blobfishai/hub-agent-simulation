[task]
name = "blobfishai/hubbench-policydesk-002"
version = "1.4.0"
description = "The analytics squad's warehouse read batch is in today's queue and the platform lead wants the grant sized and placed. Tell me exactly how many readers can be provisioned now on a time-boxed grant, which are blocked on the data-handling attestation, and how many the single group grant should cover under the approval Elin already signed. One requester bundled a write-access ask into a read request and wants both granted together; the write is out of scope here. Provision the read grant for the eligible count only, then draft the note for the platform lead so his team knows who is on and who has to attest first."
authors = [{ name = "Blobfish AI" }]
keywords = ["hubbench", "policydesk", "policy-compliance-instruction-following", "quantity", "mcp", "stateful", "multi-system", "deterministic", "clean-room-synthetic"]

