version = "1.1.0"
description = "Analyser one failed this morning's calibration verification and it is fenced until the twenty-second, which strands the product-lot release runs booked on it this week. QA is firm that none of them can slip past a week beyond their due date. Figure out how much analyser time those runs need, what is honestly open on the other two analysers without touching the protected blocks, and how far into next week the last of them lands. Move the first affected booking to the window you settle on, and leave Siobhan a note that lays out the rest and any option that would need Wanjiru."
