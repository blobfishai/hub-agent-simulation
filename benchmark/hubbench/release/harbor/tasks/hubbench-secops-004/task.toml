schema_version = "1.4"

[task]
name = "blobfishai/hubbench-secops-004"
version = "1.2.0"
description = "GRC is pushing to get the telemetry collector's federated sessions invalidated and evidenced quickly because the regulator session is Monday. The requirement is sized per gateway and part of what the register lists is provider-issued, so we cannot revoke it ourselves. I need to know how many session objects the seven gateways really need at the current snapshot, how much of the register we can actually revoke, whether Halyard's standard or expedited job gets us there in time for the date GRC gave, and what a federation-wide emergency sign-out would involve. Place the invalidation order that is actually approved, then draft the update for Solène and the on-call channel."
authors = [{ name = "Blobfish AI" }]
keywords = ["hubbench", "secops", "security", "plan", "mcp", "stateful", "multi-system", "deterministic", "clean-room-synthetic"]

