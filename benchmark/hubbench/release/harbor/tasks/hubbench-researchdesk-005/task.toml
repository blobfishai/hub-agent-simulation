schema_version = "1.4"

[task]
name = "blobfishai/hubbench-researchdesk-005"
version = "1.1.0"
description = "Corporate development wants the Southeast Asia expansion brief to claim ten markets are launch-ready, while the current research room contains partner attestations, duplicated regulatory summaries, and two expired tax opinions. Establish the active readiness definition and the source positions the brief actually requires, reconcile which evidence remains independent and current, and quantify the uncovered positions. Compare an approved verified packet with waiting for refreshed opinions or relying on ranked snippets. Create the packet using only supported sources and draft the strategy lead a note that names the remaining evidence gap and the authority boundary."
authors = [{ name = "Blobfish AI" }]
keywords = ["hubbench", "researchdesk", "reasoning-knowledge-qa", "plan", "mcp", "stateful", "multi-system", "deterministic", "clean-room-synthetic"]

