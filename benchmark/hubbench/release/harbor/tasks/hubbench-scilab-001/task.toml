[task]
name = "blobfishai/hubbench-scilab-001"
version = "1.3.0"
description = "Friday's IL-6 run for sponsor batch B-2611 was invalidated on a plate-end control and the sponsor locks the data Thursday morning. Before the sponsor call I need the honest picture: how many control vials the re-run and its duplicate actually need at the current batch count under the protocol version in force, how many of what the fridge shows are genuinely released once the excursion lot and the short-dated lot are set aside, whether Ostrander's shipment changes the date, and what an evening run would really involve. Book the analyser window that works and leave Ingrid a draft she can take into the call. Anything that needs Petter or Camille should be flagged, not assumed."
authors = [{ name = "Blobfish AI" }]
keywords = ["hubbench", "scilab", "scientific-research", "plan", "mcp", "stateful", "multi-system", "deterministic", "clean-room-synthetic"]

