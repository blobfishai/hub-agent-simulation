version = "1.4.0"
description = "Customer communications want the planned-outage notice for the notification broker upgrade published today. Work out how long the outage genuinely is at our measured restart timing rather than the vendor's estimate, how long the notice must be once the rollback reserve is added, whether the error budget honestly allows the booked date after last month's quorum loss or forces a slip, and what the early-access package, a budget exception, or splitting the upgrade would actually buy. Create the notice the evidence supports and draft the update for Adaeze, flagging anything that would need Tunde or Inês."
