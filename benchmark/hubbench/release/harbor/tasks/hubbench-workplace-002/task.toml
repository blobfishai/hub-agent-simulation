version = "1.4.0"
description = "Tamsin & Vale have sent a formal credit claim for the release week in March, listing five tickets and a figure that assumes every one of them breached. Harriet wants an answer before the May invoice. Work out what the Plus policy actually entitles them to once each ticket's clock is checked, what on their ledger already counts against it, and how much credit we still owe. Raise the memo the evidence supports, on the billing route that meets the contractual deadline without spending more than we must, and draft the note for Harriet. Anything above Folake's limit or outside the contract should be flagged for Mats, not raised."
