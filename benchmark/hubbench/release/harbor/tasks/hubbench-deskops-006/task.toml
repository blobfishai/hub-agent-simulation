[task]
name = "blobfishai/hubbench-deskops-006"
version = "1.3.0"
description = "The atrium is shut for the HVAC replacement, so the design review week cannot happen in-house, and Maeve has asked for Quayside in the week of 22 June with all six reviewers present for both session days. Establish how many attendee-days the reviews need, what the requested week genuinely offers once non-session days and the reviewers' hard commitments are removed, and if it falls short, the earliest open Quayside week that clears everyone before the design-system freeze. Move the event to the week that works and leave Maeve a note with the date, what ruled out her first choice, and anything that would need Petra or finance."
authors = [{ name = "Blobfish AI" }]
keywords = ["hubbench", "deskops", "computer-use-gui", "schedule", "mcp", "stateful", "multi-system", "deterministic", "clean-room-synthetic"]

