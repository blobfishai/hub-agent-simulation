[task]
name = "blobfishai/hubbench-deskops-004"
version = "1.4.0"
description = "Fennimore Hall double-booked the week of the field engineering summit and offered us a week later in June or one in July, and the deployment freeze at the start of July means the summit cannot slip past June. Rhea needs to know how many of the required people actually travel under the current agenda, which of their tickets Wayfinder can re-issue and which are forfeited, whether the standard queue or the rush queue is what makes the June week reachable, and what the honest cost is. Submit the booking change the approval supports and draft the note for Rhea; buying open-market fares or anything else that needs Rui or Ifeoma should be flagged, not done."
