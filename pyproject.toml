[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hub-agent-simulation"
version = "1.0.0"
description = "HubBench: one oracle-proven, deterministically graded Blobfish benchmark family per Harbor Hub domain cluster — stateful multi-system worlds over MCP, REST, a web console, and a CLI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Blobfish AI" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["benchmark/hubbench/tests"]
addopts = "-q"
